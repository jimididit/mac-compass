# GoReleaser config: builds macOS binaries from a v* tag. It runs on a macOS runner so each binary can be
# ad-hoc code signed (an unsigned x86_64 binary is killed by macOS when it carries the download quarantine
# flag). Ad-hoc signing gives no developer identity; Developer ID signing and notarization are separate.
version: 2

project_name: mac-compass

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mac-compass
    main: .
    binary: mac-compass
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jimididit/mac-compass/cmd.version={{ .Version }}
    hooks:
      post:
        - cmd: codesign --force --sign - --identifier io.github.jimididit.mac-compass "{{ .Path }}"

# One fat binary that runs natively on Apple Silicon and Intel.
universal_binaries:
  - id: universal
    ids: [mac-compass]
    replace: false
    name_template: mac-compass
    hooks:
      post:
        - cmd: codesign --force --sign - --identifier io.github.jimididit.mac-compass "{{ .Path }}"

archives:
  - id: universal
    ids: [universal]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_macos_universal"
    files: [LICENSE, README.md]
  - id: per-arch
    ids: [mac-compass]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_macos_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci:"

release:
  github:
    owner: jimididit
    name: mac-compass
  draft: true  # review the notes and assets, then publish by hand
  prerelease: auto
