name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the (draft) release and upload assets
  id-token: write       # sign build provenance
  attestations: write   # publish build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changelog needs history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest build provenance
        # Attestations need a public repo (or GitHub Enterprise Cloud); skip while this repo is private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
