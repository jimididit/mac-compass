name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = Tahoe arm64, macos-26-intel = Tahoe x86_64, macos-15* = Sequoia.
        # macOS 14 runners are deprecated by GitHub; macOS 27 has no hosted image yet.
        os: [ubuntu-latest, macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  macos-run:
    name: real macOS run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o mac-compass .
      - name: collect
        timeout-minutes: 10  # a stalled check must fail this step, not cancel the job and lose its logs
        # Failing checks are data, not CI failures; the artifacts and summary are the point.
        run: |
          set +e  # failing checks must not abort the step; exit codes are recorded below
          mkdir out
          sw_vers | tee out/sw_vers.txt
          uname -m | tee out/uname.txt
          sudo ./mac-compass run-all -y --vm --progress --json --html out/report.html --sarif out/report.sarif > out/run-all.json 2> out/progress.txt; echo "run-all exit=$?" | tee -a out/exit.txt
          # Unprivileged pass: proves checks marked sudo:false really work as a normal user.
          ./mac-compass run-all -y --vm --no-sudo --json > out/run-all-nosudo.json; echo "nosudo exit=$?" | tee -a out/exit.txt
          test -s out/run-all.json && test -s out/run-all-nosudo.json
          sudo chown "$(id -un)" out/report.html out/report.sarif
          # Report formats: SARIF is well-formed and HTML is inert.
          jq -e '.version == "2.1.0" and (.runs[0].results | type == "array") and (.runs[0].tool.driver.rules | length) > 0' out/report.sarif >/dev/null
          grep -q "Content-Security-Policy" out/report.html
          ! grep -qi "<script" out/report.html
      - name: posture (score is computed and shown in text, JSON and HTML)
        run: |
          set +e
          sudo ./mac-compass posture --vm > out/posture.txt 2> out/posture-stderr.txt; echo "posture exit=$?" | tee -a out/exit.txt
          set -e
          cat out/posture.txt
          grep -q "Score: " out/posture.txt
          jq -e '.posture | (.controls | length) >= 16 and (.passed + .failed) > 0 and .score >= 0 and .score <= 100' out/run-all.json
          grep -q "Hardening posture" out/report.html
      - name: privacy database checks explain themselves
        run: |
          set -e
          # Each privacy check either returns data, reports there is no per-user database, or fails with a
          # Full Disk Access diagnosis; it must never fail with no explanation.
          for f in run-all run-all-nosudo; do
            for id in security-tools.tcc-system security-tools.tcc-user; do
              jq -r --arg id "$id" --arg f "$f" '.sections[].checks[] | select(.id==$id) | "\($f) \($id): skipped=\(.skipped // false) ok=\(.ok) \(.skip_reason // "") \((.stdout // "") | split("\n") | map(select(test("tcc-db"))) | join("")) \((.stderr // "") | split("\n") | map(select(test("full-disk-access"))) | join(""))"' out/$f.json | tee -a out/tcc-diagnosis.txt
              jq -e --arg id "$id" '.sections[].checks[] | select(.id==$id) | (.skipped or .ok or ((.stderr // "") | test("full-disk-access: (denied|granted|unknown)")))' out/$f.json >/dev/null
            done
          done
      - name: baseline (snapshot, plant a change, compare)
        run: |
          set -e
          sudo ./mac-compass snapshot --vm -o out/snap-a.json
          sudo ./mac-compass compare out/snap-a.json --vm --json > out/compare-untouched.json || true
          mkdir -p "$HOME/Library/LaunchAgents"
          touch "$HOME/Library/LaunchAgents/com.example.compass-ci-test.plist"
          sudo ./mac-compass snapshot --vm -o out/snap-b.json
          sudo ./mac-compass compare out/snap-a.json out/snap-b.json --json > out/compare-planted.json || true
          rm -f "$HOME/Library/LaunchAgents/com.example.compass-ci-test.plist"
          # Snapshots are root-owned 0600 (by design); hand them to the runner user so they can be uploaded.
          sudo chown "$(id -un)" out/snap-a.json out/snap-b.json
          # The planted LaunchAgent must be reported as new; this proves snapshot+compare end to end.
          jq -e '.findings[] | select(.id=="persistence.launchagents-user" and .status=="fail" and (.detail|contains("com.example.compass-ci-test.plist")))' out/compare-planted.json
      - name: deep mode (launch item hashes, signature verification, tampering is classified)
        run: |
          set -e
          # The deep check runs and its findings are shown (a failing signature on a runner image is data to look at).
          sudo ./mac-compass persistence --deep --vm --json > out/deep.json || true
          jq -e '.sections[].checks[] | select(.id=="persistence.launch-integrity") | .ok' out/deep.json
          jq -r '.findings[] | select(.id=="persistence.launch-integrity") | "\(.status) \(.severity // "") \(.title)"' out/deep.json | tee out/deep-findings.txt
          # A launch item whose script changes between two snapshots must be classified, not just listed.
          mkdir -p "$HOME/Library/LaunchAgents" "$HOME/bin"
          printf '#!/bin/sh\necho one\n' > "$HOME/bin/compass-deep-test.sh"; chmod +x "$HOME/bin/compass-deep-test.sh"
          cat > "$HOME/Library/LaunchAgents/com.example.compass-deep-test.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Label</key><string>com.example.compass-deep-test</string>
          <key>ProgramArguments</key><array><string>$HOME/bin/compass-deep-test.sh</string></array></dict></plist>
          PLIST
          sudo ./mac-compass snapshot --deep --vm -o out/deep-a.json
          echo 'echo two' >> "$HOME/bin/compass-deep-test.sh"
          sudo ./mac-compass snapshot --deep --vm -o out/deep-b.json
          rm -f "$HOME/Library/LaunchAgents/com.example.compass-deep-test.plist" "$HOME/bin/compass-deep-test.sh"
          sudo chown "$(id -un)" out/deep-a.json out/deep-b.json
          jq -e '.checks["persistence.launch-integrity"].items | length > 0' out/deep-a.json
          ./mac-compass compare out/deep-a.json out/deep-b.json --json > out/deep-compare.json || true
          jq -e '.findings[] | select(.id=="persistence.launch-integrity" and .status=="fail" and .severity=="medium" and (.detail | contains("compass-deep-test")))' out/deep-compare.json
          # The same snapshot against itself shows nothing for this check.
          ./mac-compass compare out/deep-a.json out/deep-a.json --json > out/deep-same.json || true
          ! jq -e '.findings[] | select(.id=="persistence.launch-integrity")' out/deep-same.json
          # Installed applications: the inventory ran, and a new app and a new version are told apart.
          sudo ./mac-compass advanced --deep --vm --json > out/deep-apps.json || true
          jq -e '.sections[].checks[] | select(.id=="advanced.applications") | .ok' out/deep-apps.json
          jq -r '.sections[].checks[] | select(.id=="advanced.applications") | .stdout' out/deep-apps.json | awk -F'\t' 'NR>1 && NF==7 {n++; if ($7 != "-") h++} END {print "apps: " n+0 " listed, " h+0 " with a code-directory hash"}' | tee -a out/deep-findings.txt
          mkdir -p "$HOME/Applications/CompassOne.app/Contents"
          printf '{"CFBundleIdentifier":"com.example.one","CFBundleShortVersionString":"1.0"}' > "$HOME/Applications/CompassOne.app/Contents/Info.plist"
          plutil -convert xml1 "$HOME/Applications/CompassOne.app/Contents/Info.plist"
          sudo ./mac-compass snapshot --deep --vm -o out/apps-a.json
          mkdir -p "$HOME/Applications/CompassNew.app/Contents"
          printf '{"CFBundleIdentifier":"com.example.new","CFBundleShortVersionString":"1.0"}' > "$HOME/Applications/CompassNew.app/Contents/Info.plist"
          plutil -convert xml1 "$HOME/Applications/CompassNew.app/Contents/Info.plist"
          printf '{"CFBundleIdentifier":"com.example.one","CFBundleShortVersionString":"1.1"}' > "$HOME/Applications/CompassOne.app/Contents/Info.plist"
          plutil -convert xml1 "$HOME/Applications/CompassOne.app/Contents/Info.plist"
          sudo ./mac-compass snapshot --deep --vm -o out/apps-b.json
          rm -rf "$HOME/Applications/CompassOne.app" "$HOME/Applications/CompassNew.app"
          sudo chown "$(id -un)" out/apps-a.json out/apps-b.json
          ./mac-compass compare out/apps-a.json out/apps-b.json --json > out/apps-compare.json || true
          jq -e '.findings[] | select(.id=="advanced.applications" and .status=="fail" and .severity=="low" and (.detail | contains("CompassNew.app")))' out/apps-compare.json
          jq -e '.findings[] | select(.id=="advanced.applications" and .status=="info" and (.detail | contains("updated 1.0 -> 1.1")))' out/apps-compare.json
      - name: evidence bundle (collect, verify, tamper)
        run: |
          set -e
          sudo ./mac-compass collect --vm -o out/evidence | tee out/collect.txt
          HASH=$(awk '/bundle SHA-256/ {print $3}' out/collect.txt)
          test ${#HASH} -eq 64
          sudo chown -R "$(id -un)" out/evidence
          ./mac-compass verify out/evidence --expect "$HASH"
          # A single changed byte must be caught.
          echo tamper >> out/evidence/findings.txt
          if ./mac-compass verify out/evidence --expect "$HASH"; then echo "tampering went undetected"; exit 1; fi
          # Put the file back for the artifact.
          sed -i.bak '$ d' out/evidence/findings.txt && rm out/evidence/findings.txt.bak
          ./mac-compass verify out/evidence --expect "$HASH"
      - name: monitor (baseline, plant a change, alert once, install checks)
        run: |
          set -e
          MON="$RUNNER_TEMP/mon"
          run() { ./mac-compass monitor run --state-dir "$MON" --no-sudo --vm --no-notify | tee -a out/monitor.txt; }
          run | grep -q "monitor: baselined"
          run | grep -q "monitor: clean"
          mkdir -p "$HOME/Library/LaunchAgents"
          touch "$HOME/Library/LaunchAgents/com.example.monitor-ci-test.plist"
          run | grep -q "ALERT"
          # The same unresolved problem must not alert again.
          ! run | grep -q "ALERT"
          rm -f "$HOME/Library/LaunchAgents/com.example.monitor-ci-test.plist"
          run | grep -q "monitor: clean"
          ./mac-compass monitor status --state-dir "$MON" --launch-dir "$RUNNER_TEMP/la" | tee out/monitor-status.txt
          # install writes a valid plist; a root daemon from a user-owned binary is refused.
          ./mac-compass monitor install --no-load --launch-dir "$RUNNER_TEMP/la" --state-dir "$MON" --every 15m
          plutil -lint "$RUNNER_TEMP/la/io.github.jimididit.mac-compass.monitor.plist"
          ! sudo ./mac-compass monitor install --scope system --no-load --launch-dir "$RUNNER_TEMP/ld" --state-dir "$RUNNER_TEMP/sys" 2>out/monitor-system.txt
          grep -q "refusing to install a root daemon" out/monitor-system.txt
      - name: monitor --realtime (plist, then a real trigger when launchd allows it)
        timeout-minutes: 6
        run: |
          set -e
          LA="$RUNNER_TEMP/rt-la"; ST="$RUNNER_TEMP/rt-state"
          ./mac-compass monitor install --realtime --deep --no-sudo --no-load --launch-dir "$LA" --state-dir "$ST" --every 15m | tee out/monitor-realtime.txt
          PL="$LA/io.github.jimididit.mac-compass.monitor.plist"
          plutil -lint "$PL"
          plutil -extract WatchPaths json -o - "$PL" | tee out/monitor-watchpaths.json | jq -e 'index("/Library/LaunchDaemons") != null and index("/Applications") != null'
          plutil -extract ThrottleInterval raw -o - "$PL" | grep -qx 60
          # Best effort: load it and see whether a change to a watched folder starts a run. A runner without a
          # GUI session may refuse to load the job; that is reported, not failed.
          mkdir -p "$HOME/Library/LaunchAgents"
          DOMAIN="gui/$(id -u)"
          if launchctl bootstrap "$DOMAIN" "$PL" 2> out/monitor-realtime-bootstrap.txt; then
            for i in $(seq 1 20); do [ -f "$ST/state.json" ] && break; sleep 3; done
            R1=$(jq -r '.runs // 0' "$ST/state.json" 2>/dev/null || echo 0)
            touch "$HOME/Library/LaunchAgents/com.example.realtime-test.plist"
            R2=$R1
            for i in $(seq 1 40); do sleep 5; R2=$(jq -r '.runs // 0' "$ST/state.json" 2>/dev/null || echo 0); [ "$R2" -gt "$R1" ] && break; done
            rm -f "$HOME/Library/LaunchAgents/com.example.realtime-test.plist"
            launchctl bootout "$DOMAIN/io.github.jimididit.mac-compass.monitor" || true
            echo "realtime: runs before=$R1 after=$R2" | tee -a out/monitor-realtime.txt
            [ "$R2" -gt "$R1" ]
          else
            echo "realtime: launchd would not load the job here ($(cat out/monitor-realtime-bootstrap.txt)); plist checked only" | tee -a out/monitor-realtime.txt
          fi
      - name: summary
        if: always()
        run: |
          {
            echo "**baseline, untouched machine (should be near-empty)**: $(jq -r '.summary | "\(.fail) fail, \(.info) info"' out/compare-untouched.json)"
            jq -r '.findings[] | select(.status=="fail") | "- \(.severity) \(.id): \(.title)"' out/compare-untouched.json
            echo "### $(sw_vers -productName) $(sw_vers -productVersion) ($(uname -m)) on ${{ matrix.os }}"
            echo "**posture**: $(jq -r '.posture | "\(.score)/100 (\(.passed) pass, \(.failed) fail, \(.not_assessed) not assessed)"' out/run-all.json)"
            for f in run-all run-all-nosudo; do
              echo "**$f**: $(jq -r '.summary | "\(.checks_ok) ok, \(.checks_skipped) skipped, \(.checks_failed) failed checks; findings: \(.fail) fail, \(.pass) pass, \(.info) info, \(.error) error"' out/$f.json)"
              jq -r '.sections[].checks[] | select((.ok|not) and (.skipped|not)) | "- CHECK FAILED \(.id): \(.error) \(.stderr|gsub("\n";" ")|.[0:120])"' out/$f.json
              jq -r '.findings[] | select(.status=="fail") | "- \(.severity) \(.id): \(.title)"' out/$f.json
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-run-${{ matrix.os }}
          path: out/

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # govulncheck@latest needs a newer Go than go.mod; setup-go v7 pins GOTOOLCHAIN=local.
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned: staticcheck must be built by a Go release it understands (2025.1.1 = Go 1.24).
      # Bump this together with the go directive in go.mod.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
