name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macos-26 = Tahoe arm64, macos-26-intel = Tahoe x86_64, macos-15* = Sequoia.
        # macOS 14 runners are deprecated by GitHub; macOS 27 has no hosted image yet.
        os: [ubuntu-latest, macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  macos-run:
    name: real macOS run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o mac-compass .
      - name: collect
        timeout-minutes: 10  # a stalled check must fail this step, not cancel the job and lose its logs
        # Failing checks are data, not CI failures; the artifacts and summary are the point.
        run: |
          set +e  # failing checks must not abort the step; exit codes are recorded below
          mkdir out
          sw_vers | tee out/sw_vers.txt
          uname -m | tee out/uname.txt
          sudo ./mac-compass run-all -y --vm --progress --json --html out/report.html --sarif out/report.sarif > out/run-all.json 2> out/progress.txt; echo "run-all exit=$?" | tee -a out/exit.txt
          # Unprivileged pass: proves checks marked sudo:false really work as a normal user.
          ./mac-compass run-all -y --vm --no-sudo --json > out/run-all-nosudo.json; echo "nosudo exit=$?" | tee -a out/exit.txt
          test -s out/run-all.json && test -s out/run-all-nosudo.json
          sudo chown "$(id -un)" out/report.html out/report.sarif
          # Report formats: SARIF is well-formed and HTML is inert.
          jq -e '.version == "2.1.0" and (.runs[0].results | type == "array") and (.runs[0].tool.driver.rules | length) > 0' out/report.sarif >/dev/null
          grep -q "Content-Security-Policy" out/report.html
          ! grep -qi "<script" out/report.html
      - name: baseline (snapshot, plant a change, compare)
        run: |
          set -e
          sudo ./mac-compass snapshot --vm -o out/snap-a.json
          sudo ./mac-compass compare out/snap-a.json --vm --json > out/compare-untouched.json || true
          mkdir -p "$HOME/Library/LaunchAgents"
          touch "$HOME/Library/LaunchAgents/com.example.compass-ci-test.plist"
          sudo ./mac-compass snapshot --vm -o out/snap-b.json
          sudo ./mac-compass compare out/snap-a.json out/snap-b.json --json > out/compare-planted.json || true
          rm -f "$HOME/Library/LaunchAgents/com.example.compass-ci-test.plist"
          # Snapshots are root-owned 0600 (by design); hand them to the runner user so they can be uploaded.
          sudo chown "$(id -un)" out/snap-a.json out/snap-b.json
          # The planted LaunchAgent must be reported as new; this proves snapshot+compare end to end.
          jq -e '.findings[] | select(.id=="persistence.launchagents-user" and .status=="fail" and (.detail|contains("com.example.compass-ci-test.plist")))' out/compare-planted.json
      - name: evidence bundle (collect, verify, tamper)
        run: |
          set -e
          sudo ./mac-compass collect --vm -o out/evidence | tee out/collect.txt
          HASH=$(awk '/bundle SHA-256/ {print $3}' out/collect.txt)
          test ${#HASH} -eq 64
          sudo chown -R "$(id -un)" out/evidence
          ./mac-compass verify out/evidence --expect "$HASH"
          # A single changed byte must be caught.
          echo tamper >> out/evidence/findings.txt
          if ./mac-compass verify out/evidence --expect "$HASH"; then echo "tampering went undetected"; exit 1; fi
          # Put the file back for the artifact.
          sed -i.bak '$ d' out/evidence/findings.txt && rm out/evidence/findings.txt.bak
          ./mac-compass verify out/evidence --expect "$HASH"
      - name: monitor (baseline, plant a change, alert once, install checks)
        run: |
          set -e
          MON="$RUNNER_TEMP/mon"
          run() { ./mac-compass monitor run --state-dir "$MON" --no-sudo --vm --no-notify | tee -a out/monitor.txt; }
          run | grep -q "monitor: baselined"
          run | grep -q "monitor: clean"
          mkdir -p "$HOME/Library/LaunchAgents"
          touch "$HOME/Library/LaunchAgents/com.example.monitor-ci-test.plist"
          run | grep -q "ALERT"
          # The same unresolved problem must not alert again.
          ! run | grep -q "ALERT"
          rm -f "$HOME/Library/LaunchAgents/com.example.monitor-ci-test.plist"
          run | grep -q "monitor: clean"
          ./mac-compass monitor status --state-dir "$MON" --launch-dir "$RUNNER_TEMP/la" | tee out/monitor-status.txt
          # install writes a valid plist; a root daemon from a user-owned binary is refused.
          ./mac-compass monitor install --no-load --launch-dir "$RUNNER_TEMP/la" --state-dir "$MON" --every 15m
          plutil -lint "$RUNNER_TEMP/la/io.github.jimididit.mac-compass.monitor.plist"
          ! sudo ./mac-compass monitor install --scope system --no-load --launch-dir "$RUNNER_TEMP/ld" --state-dir "$RUNNER_TEMP/sys" 2>out/monitor-system.txt
          grep -q "refusing to install a root daemon" out/monitor-system.txt
      - name: summary
        if: always()
        run: |
          {
            echo "**baseline, untouched machine (should be near-empty)**: $(jq -r '.summary | "\(.fail) fail, \(.info) info"' out/compare-untouched.json)"
            jq -r '.findings[] | select(.status=="fail") | "- \(.severity) \(.id): \(.title)"' out/compare-untouched.json
            echo "### $(sw_vers -productName) $(sw_vers -productVersion) ($(uname -m)) on ${{ matrix.os }}"
            for f in run-all run-all-nosudo; do
              echo "**$f**: $(jq -r '.summary | "\(.checks_ok) ok, \(.checks_skipped) skipped, \(.checks_failed) failed checks; findings: \(.fail) fail, \(.pass) pass, \(.info) info, \(.error) error"' out/$f.json)"
              jq -r '.sections[].checks[] | select((.ok|not) and (.skipped|not)) | "- CHECK FAILED \(.id): \(.error) \(.stderr|gsub("\n";" ")|.[0:120])"' out/$f.json
              jq -r '.findings[] | select(.status=="fail") | "- \(.severity) \(.id): \(.title)"' out/$f.json
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-run-${{ matrix.os }}
          path: out/

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # govulncheck@latest needs a newer Go than go.mod; setup-go v7 pins GOTOOLCHAIN=local.
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned: staticcheck must be built by a Go release it understands (2025.1.1 = Go 1.24).
      # Bump this together with the go directive in go.mod.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
