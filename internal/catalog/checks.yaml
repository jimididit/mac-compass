# mac-compass check catalog (authored from reference doc detecting-compromise.md)
# section: triage | processes | kernel | persistence | network | security-tools | advanced | harden
#
# Rules: every check is read-only; commands use absolute paths; each check appears once
# across the whole catalog (run-all runs everything). ok_exit lists non-zero exit codes
# that mean "ran fine" (e.g. grep found nothing). arch/optional gate checks that only
# exist on some Macs; attack lists MITRE ATT&CK technique ids the check helps detect; macos_min/macos_max bound the macOS major version (11..27).

checks:
  # --- 1. Quick Triage ---
  - id: triage.sip
    section: triage
    name: SIP status
    description: Check System Integrity Protection status; expected "enabled"
    command: /usr/bin/csrutil
    args: [status]
    sudo: false
    attack: [T1562.001]
  - id: triage.sip-authenticated-root
    section: triage
    name: SIP authenticated root
    description: Sealed system volume status; expected "enabled"
    command: /usr/bin/csrutil
    args: [authenticated-root, status]
    sudo: false
    macos_min: 11
    optional: true
  - id: triage.gatekeeper
    section: triage
    name: Gatekeeper status
    description: Verify Gatekeeper (assessments) is enabled
    command: /usr/sbin/spctl
    args: [--status]
    sudo: false
    attack: [T1553.001]
  - id: triage.kext-non-apple
    section: triage
    name: Non-Apple kernel extensions
    description: Loaded kernel extensions not signed by Apple (kmutil; kextstat is deprecated)
    script: /usr/bin/kmutil showloaded | grep -v com.apple
    sudo: false
    macos_min: 11
    ok_exit: [1]
    attack: [T1547.006]
  - id: triage.launchdaemons
    section: triage
    name: LaunchDaemons
    description: Quick check /Library/LaunchDaemons/
    command: /bin/ls
    args: [-la, /Library/LaunchDaemons/]
    sudo: false
    attack: [T1543.004]
  - id: triage.launchagents-system
    section: triage
    name: LaunchAgents (system)
    description: Quick check /Library/LaunchAgents/
    command: /bin/ls
    args: [-la, /Library/LaunchAgents/]
    sudo: false
    attack: [T1543.001]

  # --- 2. Process & Memory ---
  - id: processes.signatures
    section: processes
    name: Running program signatures
    description: Each distinct program currently running, with its code-signing and notarization state
    builtin: process-signatures
    sudo: false
    attack: [T1036]
  - id: processes.ps-all
    section: processes
    name: All processes (full)
    description: List all running processes with full details
    command: /bin/ps
    args: [auxww]
    sudo: false
  - id: processes.high-cpu
    section: processes
    name: High CPU processes
    description: Processes using >50% CPU
    script: ps aux | awk '$3 > 50 {print}'
    sudo: false
  - id: processes.high-memory
    section: processes
    name: High memory processes
    description: Processes using >50% memory
    script: ps aux | awk '$4 > 50 {print}'
    sudo: false
  - id: processes.launchctl-dyld
    section: processes
    name: System launchctl DYLD
    description: Check for dyld env vars (dylib injection) in system domain
    script: launchctl print system | grep DYLD
    sudo: true
    ok_exit: [1]
    attack: [T1574.006]

  # --- 3. Kernel & Rootkit ---
  - id: kernel.kext-loaded
    section: kernel
    name: Loaded kernel extensions
    description: All loaded kernel extensions (kmutil; kextstat is deprecated)
    command: /usr/bin/kmutil
    args: [showloaded]
    sudo: false
    macos_min: 11
    attack: [T1547.006]
  - id: kernel.system-extensions
    section: kernel
    name: System extensions
    description: Modern system extensions (replacement for KEXTs)
    command: /usr/bin/systemextensionsctl
    args: [list]
    sudo: false
    attack: [T1547.006]
  - id: kernel.nvram-boot-args
    section: kernel
    name: NVRAM boot-args
    description: Check boot-args for suspicious modifications
    command: /usr/sbin/nvram
    args: [boot-args]
    sudo: false
    ok_exit: [1]
  - id: kernel.efi-integrity
    section: kernel
    name: EFI integrity
    description: Firmware integrity check (Intel Macs only; removed on newer macOS)
    command: /usr/libexec/firmwarecheckers/eficheck/eficheck
    args: [--integrity-check]
    sudo: true
    requires_hardware: true
    arch: x86_64
    optional: true

  # --- 4. Persistence ---
  - id: persistence.system-launchdaemons
    section: persistence
    name: System LaunchDaemons
    description: /System/Library/LaunchDaemons/
    command: /bin/ls
    args: [-lah, /System/Library/LaunchDaemons/]
    sudo: false
    attack: [T1543.004]
  - id: persistence.launchagents-user
    section: persistence
    name: LaunchAgents (user)
    description: User LaunchAgents
    script: ls -lah ~/Library/LaunchAgents/
    sudo: false
    attack: [T1543.001]
  - id: persistence.launchctl-list
    section: persistence
    name: launchctl list (system)
    description: Loaded system services
    command: /bin/launchctl
    args: [list]
    sudo: true
  - id: persistence.login-items
    section: persistence
    name: Login items
    description: Per-user login items
    command: /usr/bin/osascript
    args: [-e, 'tell application "System Events" to get the name of every login item']
    sudo: false
    timeout: 20s  # System Events can stall for over a minute when no GUI session is available
    attack: [T1547.015]
  - id: persistence.crontab
    section: persistence
    name: Cron tabs (user)
    description: Current user crontab
    command: /usr/bin/crontab
    args: [-l]
    sudo: false
    ok_exit: [1]
    attack: [T1053.003]
  - id: persistence.periodic-daily
    section: persistence
    name: Periodic daily
    description: /etc/periodic/daily/ (absent on newer macOS, e.g. 26; absence is normal)
    command: /bin/ls
    args: [-la, /etc/periodic/daily/]
    sudo: false
    ok_exit: [1]

  # --- 5. Network ---
  - id: network.listening-tcp
    section: network
    name: Listening TCP
    description: All listening TCP ports
    command: /usr/sbin/lsof
    args: [-iTCP, -sTCP:LISTEN, -n, -P]
    sudo: true
  - id: network.listening-udp
    section: network
    name: Listening UDP
    description: UDP listeners
    command: /usr/sbin/lsof
    args: [-iUDP, -n, -P]
    sudo: true
  - id: network.firewall
    section: network
    name: Firewall status
    description: Application firewall global state
    command: /usr/libexec/ApplicationFirewall/socketfilterfw
    args: [--getglobalstate]
    sudo: true
    attack: [T1562.004]
  - id: network.firewall-stealth
    section: network
    name: Firewall stealth mode
    description: Whether the firewall hides the Mac from probes such as ping and port scans
    command: /usr/libexec/ApplicationFirewall/socketfilterfw
    args: [--getstealthmode]
    sudo: true
    attack: [T1562.004]
  - id: network.dns
    section: network
    name: DNS config
    description: Current DNS configuration
    command: /usr/sbin/scutil
    args: [--dns]
    sudo: false
  - id: network.resolv-conf
    section: network
    name: resolv.conf
    description: /etc/resolv.conf
    command: /bin/cat
    args: [/etc/resolv.conf]
    sudo: false

  # --- 6. Security tools ---
  - id: security-tools.filevault
    section: security-tools
    name: FileVault status
    description: Disk encryption status
    command: /usr/bin/fdesetup
    args: [status]
    sudo: true

  # --- 7. Advanced ---
  - id: advanced.endpoint-security
    section: advanced
    name: Endpoint security (launchctl)
    description: Security-related launchd services
    script: launchctl list | grep -i security
    sudo: true
    ok_exit: [1]

  # --- 9. Harden (preventive) ---
  - id: harden.softwareupdate-list
    section: harden
    name: Software update list
    description: Available updates (contacts Apple)
    command: /usr/sbin/softwareupdate
    args: [-l]
    sudo: false
    timeout: 60s
  - id: harden.auto-update-settings
    section: harden
    name: Automatic update settings
    description: Software Update preferences (auto-check, auto-download, critical updates)
    command: /usr/bin/defaults
    args: [read, /Library/Preferences/com.apple.SoftwareUpdate]
    sudo: false
    ok_exit: [1]

  # --- 10. Accounts ---
  - id: accounts.local-users
    section: accounts
    name: Local user accounts
    description: Local accounts and their UIDs (an extra uid 0 account is a red flag)
    command: /usr/bin/dscl
    args: [., -list, /Users, UniqueID]
    sudo: false
    attack: [T1136.001]
  - id: accounts.admin-group
    section: accounts
    name: Admin group members
    description: Accounts with administrator rights
    command: /usr/bin/dscl
    args: [., -read, /Groups/admin, GroupMembership]
    sudo: false
    attack: [T1136.001]
  - id: accounts.guest
    section: accounts
    name: Guest account
    description: Whether the guest user is enabled at the login window
    command: /usr/bin/defaults
    args: [read, /Library/Preferences/com.apple.loginwindow, GuestEnabled]
    sudo: false
    ok_exit: [1]
  - id: accounts.autologin
    section: accounts
    name: Automatic login
    description: User that logs in automatically at boot, if any
    command: /usr/bin/defaults
    args: [read, /Library/Preferences/com.apple.loginwindow, autoLoginUser]
    sudo: false
    ok_exit: [1]
  - id: accounts.ssh-authorized-keys
    section: accounts
    name: SSH authorized keys
    description: Fingerprints of keys that can log in over SSH as this user
    script: '[ -f ~/.ssh/authorized_keys ] && /usr/bin/ssh-keygen -lf ~/.ssh/authorized_keys'
    sudo: false
    ok_exit: [1]
    attack: [T1098.004]

  # --- 4b. More persistence ---
  - id: persistence.btm
    section: persistence
    name: Background task management
    description: Login items and background items registered with the system (raw dump)
    command: /usr/bin/sfltool
    args: [dumpbtm]
    sudo: true
    macos_min: 13
    attack: [T1547.015, T1543.001, T1543.004]
  - id: persistence.launchd-targets
    section: persistence
    name: Launch item programs and signatures
    description: Program each launch item runs, with its code-signing and notarization state
    builtin: launchd-targets
    sudo: false
    attack: [T1543.001, T1543.004]
  - id: persistence.shell-rc
    section: persistence
    name: Shell startup files
    description: SHA-256 of shell startup files (changes here run code at every shell)
    script: /usr/bin/shasum -a 256 ~/.zshrc ~/.zprofile ~/.zshenv ~/.zlogin ~/.bash_profile ~/.bashrc ~/.profile /etc/zshrc /etc/zprofile /etc/zshenv /etc/profile /etc/bashrc 2>/dev/null
    sudo: false
    ok_exit: [1]
    attack: [T1546.004]
  - id: persistence.login-hooks
    section: persistence
    name: Login and logout hooks
    description: Deprecated loginwindow hooks that run a script as root at login or logout
    script: defaults read /Library/Preferences/com.apple.loginwindow 2>/dev/null | grep -E 'LoginHook|LogoutHook'
    sudo: false
    ok_exit: [1]
    attack: [T1037.002]
  - id: persistence.hosts
    section: persistence
    name: Hosts file entries
    description: Non-comment lines in /etc/hosts (used to redirect domains)
    script: grep -vE '^[[:space:]]*(#|$)' /etc/hosts
    sudo: false
    ok_exit: [1]
  - id: persistence.sudoers-d
    section: persistence
    name: Sudoers drop-ins
    description: Files in /etc/sudoers.d (a NOPASSWD file here is a classic privilege backdoor)
    command: /bin/ls
    args: [-1, /etc/sudoers.d]
    sudo: false
    ok_exit: [1]
    attack: [T1548.003]

  # --- 5b. More network ---
  - id: network.proxy
    section: network
    name: System proxy settings
    description: Configured HTTP/HTTPS/SOCKS/PAC proxies (a proxy can intercept traffic)
    command: /usr/sbin/scutil
    args: [--proxy]
    sudo: false
  - id: network.established
    section: network
    name: Established TCP connections
    description: Current outbound TCP connections with the owning process
    command: /usr/sbin/lsof
    args: [-iTCP, -sTCP:ESTABLISHED, -n, -P]
    sudo: true
    ok_exit: [1]

  # --- 6b. More security tools ---
  - id: security-tools.xprotect-version
    section: security-tools
    name: XProtect version
    description: Version of Apple's built-in malware signatures
    command: /usr/bin/defaults
    args: [read, /Library/Apple/System/Library/CoreServices/XProtect.bundle/Contents/Info.plist, CFBundleShortVersionString]
    sudo: false
    ok_exit: [1]
  - id: security-tools.profiles
    section: security-tools
    name: Configuration profiles
    description: Installed configuration profiles (MDM, VPN, certificates, restrictions)
    command: /usr/bin/profiles
    args: [list]
    sudo: true
    ok_exit: [1]
  - id: security-tools.mdm-enrollment
    section: security-tools
    name: MDM enrollment
    description: Whether this Mac is enrolled in device management
    command: /usr/bin/profiles
    args: [status, -type, enrollment]
    sudo: true
    ok_exit: [1]
  - id: security-tools.tcc-system
    section: security-tools
    name: Privacy grants (system)
    description: Apps allowed Full Disk Access, Accessibility, Screen Recording or input monitoring (system-wide)
    script: |
      /usr/bin/sqlite3 -readonly "/Library/Application Support/com.apple.TCC/TCC.db" "select service||'|'||client||'|'||client_type from access where auth_value=2 and service in ('kTCCServiceSystemPolicyAllFiles','kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServiceListenEvent','kTCCServicePostEvent','kTCCServiceEndpointSecurityClient')"
    sudo: true
    attack: [T1548.006]
  - id: security-tools.tcc-user
    section: security-tools
    name: Privacy grants (user)
    description: Apps allowed Accessibility, Screen Recording or input monitoring for this user
    script: |
      /usr/bin/sqlite3 -readonly "~/Library/Application Support/com.apple.TCC/TCC.db" "select service||'|'||client||'|'||client_type from access where auth_value=2 and service in ('kTCCServiceSystemPolicyAllFiles','kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServiceListenEvent','kTCCServicePostEvent','kTCCServiceEndpointSecurityClient')"
    sudo: false
    attack: [T1548.006]
