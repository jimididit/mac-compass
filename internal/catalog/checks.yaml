# mac-compass check catalog (authored from reference doc detecting-compromise.md)
# section: triage | processes | kernel | persistence | network | security-tools | advanced | harden

checks:
  # --- 1. Quick Triage ---
  - section: triage
    name: SIP status
    description: Check System Integrity Protection status; expected "enabled"
    command: /usr/bin/csrutil
    args: [status]
    sudo: false
    vm_safe: true
  - section: triage
    name: Gatekeeper status
    description: Verify Gatekeeper (assessments) is enabled
    command: /usr/sbin/spctl
    args: [--status]
    sudo: false
    vm_safe: true
  - section: triage
    name: Non-Apple kernel extensions
    description: List loaded KEXTs excluding Apple
    script: kextstat | grep -v com.apple
    sudo: false
    vm_safe: true
    ok_exit: [1]
  - section: triage
    name: All loaded KEXTs (detailed)
    description: List all loaded kernel extensions with details
    command: /usr/sbin/kextstat
    args: [-l]
    sudo: false
    vm_safe: true
  - section: triage
    name: EFI integrity check
    description: Check for modifications to critical system/firmware files
    command: /usr/libexec/firmwarecheckers/eficheck/eficheck
    args: [--integrity-check]
    sudo: true
    vm_safe: false
    requires_hardware: true
  - section: triage
    name: LaunchDaemons
    description: Quick check /Library/LaunchDaemons/
    command: /bin/ls
    args: [-la, /Library/LaunchDaemons/]
    sudo: false
    vm_safe: true
  - section: triage
    name: LaunchAgents (system)
    description: Quick check /Library/LaunchAgents/
    command: /bin/ls
    args: [-la, /Library/LaunchAgents/]
    sudo: false
    vm_safe: true

  # --- 2. Process & Memory ---
  - section: processes
    name: All processes (full)
    description: List all running processes with full details
    command: /bin/ps
    args: [auxww]
    sudo: false
    vm_safe: true
  - section: processes
    name: High CPU processes
    description: Processes using >50% CPU
    script: ps aux | awk '$3 > 50 {print}'
    sudo: false
    vm_safe: true
  - section: processes
    name: High memory processes
    description: Processes using >50% memory
    script: ps aux | awk '$4 > 50 {print}'
    sudo: false
    vm_safe: true
  - section: processes
    name: Listening TCP
    description: Processes with listening TCP ports
    command: /usr/sbin/lsof
    args: [-i, TCP, -s, TCP:LISTEN, -n, -P]
    sudo: true
    vm_safe: true
  - section: processes
    name: System launchctl DYLD
    description: Check for dyld env vars (dylib injection) in system domain
    script: launchctl print system | grep DYLD
    sudo: true
    vm_safe: true
    ok_exit: [1]

  # --- 3. Kernel & Rootkit ---
  - section: kernel
    name: Loaded KEXTs
    description: List all loaded kernel extensions
    command: /usr/sbin/kextstat
    args: []
    sudo: false
    vm_safe: true
  - section: kernel
    name: Non-Apple KEXTs
    description: Unsigned or suspicious kernel extensions
    script: kextstat | grep -v "com.apple" | grep -v "com.intel"
    sudo: false
    vm_safe: true
    ok_exit: [1]
  - section: kernel
    name: System extensions
    description: Modern system extensions (replacement for KEXTs)
    command: /usr/bin/systemextensionsctl
    args: [list]
    sudo: false
    vm_safe: true
  - section: kernel
    name: NVRAM boot-args
    description: Check boot-args for suspicious modifications
    command: /usr/sbin/nvram
    args: [boot-args]
    sudo: false
    vm_safe: true
  - section: kernel
    name: EFI integrity
    description: Firmware integrity check
    command: /usr/libexec/firmwarecheckers/eficheck/eficheck
    args: [--integrity-check]
    sudo: true
    vm_safe: false
    requires_hardware: true

  # --- 4. Persistence ---
  - section: persistence
    name: LaunchDaemons (full)
    description: System-wide LaunchDaemons
    command: /bin/ls
    args: [-lah, /Library/LaunchDaemons/]
    sudo: false
    vm_safe: true
  - section: persistence
    name: System LaunchDaemons
    description: /System/Library/LaunchDaemons/
    command: /bin/ls
    args: [-lah, /System/Library/LaunchDaemons/]
    sudo: false
    vm_safe: true
  - section: persistence
    name: LaunchAgents (user)
    description: User LaunchAgents
    script: ls -lah ~/Library/LaunchAgents/
    sudo: false
    vm_safe: true
  - section: persistence
    name: launchctl list (system)
    description: Loaded system services
    command: /bin/launchctl
    args: [list]
    sudo: true
    vm_safe: true
  - section: persistence
    name: Login items
    description: Per-user login items
    command: /usr/bin/osascript
    args: [-e, 'tell application "System Events" to get the name of every login item']
    sudo: false
    vm_safe: true
  - section: persistence
    name: Cron tabs (user)
    description: Current user crontab
    command: /usr/bin/crontab
    args: [-l]
    sudo: false
    vm_safe: true
    ok_exit: [1]
  - section: persistence
    name: Periodic daily
    description: /etc/periodic/daily/
    command: /bin/ls
    args: [-la, /etc/periodic/daily/]
    sudo: false
    vm_safe: true

  # --- 5. Network ---
  - section: network
    name: Listening TCP
    description: All listening TCP ports
    command: /usr/sbin/lsof
    args: [-iTCP, -sTCP:LISTEN, -n, -P]
    sudo: true
    vm_safe: true
  - section: network
    name: Listening UDP
    description: UDP listeners
    command: /usr/sbin/lsof
    args: [-iUDP, -n, -P]
    sudo: true
    vm_safe: true
  - section: network
    name: Firewall status
    description: Application firewall global state
    command: /usr/libexec/ApplicationFirewall/socketfilterfw
    args: [--getglobalstate]
    sudo: true
    vm_safe: true
  - section: network
    name: DNS config
    description: Current DNS configuration
    command: /usr/sbin/scutil
    args: [--dns]
    sudo: false
    vm_safe: true
  - section: network
    name: resolv.conf
    description: /etc/resolv.conf
    command: /bin/cat
    args: [/etc/resolv.conf]
    sudo: false
    vm_safe: true

  # --- 6. Security tools ---
  - section: security-tools
    name: Gatekeeper status
    description: spctl status
    command: /usr/sbin/spctl
    args: [--status]
    sudo: false
    vm_safe: true
  - section: security-tools
    name: FileVault status
    description: Disk encryption status
    command: /usr/bin/fdesetup
    args: [status]
    sudo: true
    vm_safe: true

  # --- 7. Advanced ---
  - section: advanced
    name: Endpoint security (launchctl)
    description: Security-related launchd services
    script: launchctl list | grep -i security
    sudo: true
    vm_safe: true
    ok_exit: [1]
  - section: advanced
    name: System extensions list
    description: Loaded system extensions
    command: /usr/bin/systemextensionsctl
    args: [list]
    sudo: false
    vm_safe: true

  # --- 9. Harden (preventive) ---
  - section: harden
    name: Software update list
    description: Available updates
    command: /usr/sbin/softwareupdate
    args: [-l]
    sudo: false
    vm_safe: true
  - section: harden
    name: Firewall state
    description: Current firewall state
    command: /usr/libexec/ApplicationFirewall/socketfilterfw
    args: [--getglobalstate]
    sudo: true
    vm_safe: true
