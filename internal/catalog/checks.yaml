# mac-compass check catalog (authored from reference doc detecting-compromise.md)
# section: triage | processes | kernel | persistence | network | security-tools | advanced | harden
#
# Rules: every check is read-only; commands use absolute paths; each check appears once
# across the whole catalog (run-all runs everything). ok_exit lists non-zero exit codes
# that mean "ran fine" (e.g. grep found nothing). arch/optional gate checks that only
# exist on some Macs; macos_min/macos_max bound the macOS major version (11..27).

checks:
  # --- 1. Quick Triage ---
  - section: triage
    name: SIP status
    description: Check System Integrity Protection status; expected "enabled"
    command: /usr/bin/csrutil
    args: [status]
    sudo: false
    vm_safe: true
  - section: triage
    name: SIP authenticated root
    description: Sealed system volume status; expected "enabled"
    command: /usr/bin/csrutil
    args: [authenticated-root, status]
    sudo: false
    vm_safe: true
    macos_min: 11
    optional: true
  - section: triage
    name: Gatekeeper status
    description: Verify Gatekeeper (assessments) is enabled
    command: /usr/sbin/spctl
    args: [--status]
    sudo: false
    vm_safe: true
  - section: triage
    name: Non-Apple kernel extensions
    description: Loaded kernel extensions not signed by Apple (kmutil; kextstat is deprecated)
    script: /usr/bin/kmutil showloaded | grep -v com.apple
    sudo: false
    vm_safe: true
    macos_min: 11
    ok_exit: [1]
  - section: triage
    name: LaunchDaemons
    description: Quick check /Library/LaunchDaemons/
    command: /bin/ls
    args: [-la, /Library/LaunchDaemons/]
    sudo: false
    vm_safe: true
  - section: triage
    name: LaunchAgents (system)
    description: Quick check /Library/LaunchAgents/
    command: /bin/ls
    args: [-la, /Library/LaunchAgents/]
    sudo: false
    vm_safe: true

  # --- 2. Process & Memory ---
  - section: processes
    name: All processes (full)
    description: List all running processes with full details
    command: /bin/ps
    args: [auxww]
    sudo: false
    vm_safe: true
  - section: processes
    name: High CPU processes
    description: Processes using >50% CPU
    script: ps aux | awk '$3 > 50 {print}'
    sudo: false
    vm_safe: true
  - section: processes
    name: High memory processes
    description: Processes using >50% memory
    script: ps aux | awk '$4 > 50 {print}'
    sudo: false
    vm_safe: true
  - section: processes
    name: System launchctl DYLD
    description: Check for dyld env vars (dylib injection) in system domain
    script: launchctl print system | grep DYLD
    sudo: true
    vm_safe: true
    ok_exit: [1]

  # --- 3. Kernel & Rootkit ---
  - section: kernel
    name: Loaded kernel extensions
    description: All loaded kernel extensions (kmutil; kextstat is deprecated)
    command: /usr/bin/kmutil
    args: [showloaded]
    sudo: false
    vm_safe: true
    macos_min: 11
  - section: kernel
    name: System extensions
    description: Modern system extensions (replacement for KEXTs)
    command: /usr/bin/systemextensionsctl
    args: [list]
    sudo: false
    vm_safe: true
  - section: kernel
    name: NVRAM boot-args
    description: Check boot-args for suspicious modifications
    command: /usr/sbin/nvram
    args: [boot-args]
    sudo: false
    vm_safe: true
    ok_exit: [1]
  - section: kernel
    name: EFI integrity
    description: Firmware integrity check (Intel Macs only; removed on newer macOS)
    command: /usr/libexec/firmwarecheckers/eficheck/eficheck
    args: [--integrity-check]
    sudo: true
    vm_safe: false
    requires_hardware: true
    arch: x86_64
    optional: true

  # --- 4. Persistence ---
  - section: persistence
    name: System LaunchDaemons
    description: /System/Library/LaunchDaemons/
    command: /bin/ls
    args: [-lah, /System/Library/LaunchDaemons/]
    sudo: false
    vm_safe: true
  - section: persistence
    name: LaunchAgents (user)
    description: User LaunchAgents
    script: ls -lah ~/Library/LaunchAgents/
    sudo: false
    vm_safe: true
  - section: persistence
    name: launchctl list (system)
    description: Loaded system services
    command: /bin/launchctl
    args: [list]
    sudo: true
    vm_safe: true
  - section: persistence
    name: Login items
    description: Per-user login items
    command: /usr/bin/osascript
    args: [-e, 'tell application "System Events" to get the name of every login item']
    sudo: false
    vm_safe: true
  - section: persistence
    name: Cron tabs (user)
    description: Current user crontab
    command: /usr/bin/crontab
    args: [-l]
    sudo: false
    vm_safe: true
    ok_exit: [1]
  - section: persistence
    name: Periodic daily
    description: /etc/periodic/daily/ (absent on newer macOS, e.g. 26; absence is normal)
    command: /bin/ls
    args: [-la, /etc/periodic/daily/]
    sudo: false
    vm_safe: true
    ok_exit: [1]

  # --- 5. Network ---
  - section: network
    name: Listening TCP
    description: All listening TCP ports
    command: /usr/sbin/lsof
    args: [-iTCP, -sTCP:LISTEN, -n, -P]
    sudo: true
    vm_safe: true
  - section: network
    name: Listening UDP
    description: UDP listeners
    command: /usr/sbin/lsof
    args: [-iUDP, -n, -P]
    sudo: true
    vm_safe: true
  - section: network
    name: Firewall status
    description: Application firewall global state
    command: /usr/libexec/ApplicationFirewall/socketfilterfw
    args: [--getglobalstate]
    sudo: true
    vm_safe: true
  - section: network
    name: DNS config
    description: Current DNS configuration
    command: /usr/sbin/scutil
    args: [--dns]
    sudo: false
    vm_safe: true
  - section: network
    name: resolv.conf
    description: /etc/resolv.conf
    command: /bin/cat
    args: [/etc/resolv.conf]
    sudo: false
    vm_safe: true

  # --- 6. Security tools ---
  - section: security-tools
    name: FileVault status
    description: Disk encryption status
    command: /usr/bin/fdesetup
    args: [status]
    sudo: true
    vm_safe: true

  # --- 7. Advanced ---
  - section: advanced
    name: Endpoint security (launchctl)
    description: Security-related launchd services
    script: launchctl list | grep -i security
    sudo: true
    vm_safe: true
    ok_exit: [1]

  # --- 9. Harden (preventive) ---
  - section: harden
    name: Software update list
    description: Available updates (contacts Apple)
    command: /usr/sbin/softwareupdate
    args: [-l]
    sudo: false
    vm_safe: true
  - section: harden
    name: Automatic update settings
    description: Software Update preferences (auto-check, auto-download, critical updates)
    command: /usr/bin/defaults
    args: [read, /Library/Preferences/com.apple.SoftwareUpdate]
    sudo: false
    vm_safe: true
    ok_exit: [1]
